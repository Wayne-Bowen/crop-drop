<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My listings | CropDrop</title>
<meta name="description" content="Manage your produce listings and see orders.">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/unbounded-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-active="dash">
<header class="site-header" id="header"></header>
<main id="main">

<div class="page-h"><div class="wrap" style="display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap"><div><span class="eyebrow">Farmer dashboard</span><h1 style="margin-top:12px">My listings</h1></div><button class="btn" id="newBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add produce</button></div></div>
<div class="wrap" style="padding-bottom:80px"><div id="banner"></div>
  <div class="stats" id="stats"></div>
  <div class="dtabs"><button class="dtab on" data-t="listings">Listings</button><button class="dtab" data-t="orders">Orders for my produce</button></div>
  <div id="pane"></div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="modal-box">
  <div class="modal-h"><h3 id="mTitle">Add produce</h3><button class="x" id="mClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <form class="form" id="pForm" novalidate>
    <div id="pMsg"></div>
    <div class="fg"><label for="pname">Name</label><input class="field" id="pname" name="name" maxlength="100"><div class="err"></div></div>
    <div class="two"><div class="fg"><label for="pcat">Category</label><select id="pcat" name="category_id"></select><div class="err"></div></div>
    <div class="fg"><label for="ploc">Location</label><input class="field" id="ploc" name="location" maxlength="100" placeholder="e.g. Nakuru"><div class="err"></div></div></div>
    <div class="two"><div class="fg"><label for="pprice">Price (KES)</label><input class="field" id="pprice" name="price" type="number" step="0.01" min="0.01"><div class="err"></div></div>
    <div class="fg"><label for="pqty">Quantity</label><input class="field" id="pqty" name="quantity" type="number" step="1" min="0"><div class="err"></div></div></div>
    <div class="fg"><label for="pdesc">Description</label><textarea id="pdesc" name="description" rows="3" maxlength="600" placeholder="Variety, how it's picked, what unit the price is for"></textarea><div class="err"></div></div>
    <div class="fg"><label for="pphoto">Photo (JPG, PNG or WEBP, up to 2 MB)</label><div class="preview" id="preview">No photo yet</div><input class="field" id="pphoto" name="photo" type="file" accept="image/jpeg,image/png,image/webp" style="margin-top:10px"><div class="err"></div></div>
    <p class="muted small">New and edited listings go to an admin for approval before buyers see them.</p>
    <button class="btn" type="submit" id="pSave">Save listing</button>
  </form>
</div></div>

</main>
<footer class="site-footer" id="footer"></footer>
<script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
