<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us | CropDrop</title>
<meta name="description" content="Get in touch with the CropDrop team.">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/unbounded-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-active="contact">
<header class="site-header" id="header"></header>
<main id="main">

<div class="page-h"><div class="wrap"><span class="eyebrow">Contact</span><h1 style="margin-top:12px">Say something</h1><p class="lead">Question, complaint, a farmer you think we should know about. We read everything.</p></div></div>
<section style="padding-top:44px"><div class="wrap split" style="align-items:start">
  <form class="form rv" id="contactForm" novalidate>
    <div id="cMsg"></div>
    <div class="fg"><label for="name">Your name</label><input class="field" id="name" name="name" autocomplete="name" maxlength="100"><div class="err"></div></div>
    <div class="fg"><label for="email">Email</label><input class="field" id="email" name="email" type="email" autocomplete="email" maxlength="150"><div class="err"></div></div>
    <div class="fg"><label for="message">Message</label><textarea id="message" name="message" rows="6" maxlength="1000"></textarea><div class="err"></div></div>
    <button class="btn" type="submit" style="justify-self:start">Send message</button>
  </form>
  <div class="panel rv" style="padding:30px"><div class="info-list" style="background:var(--s1)">
    <div><span>Email</span><b>info@cropdrop.example</b></div><div><span>Phone</span><b>+254 700 000 000</b></div><div><span>Hours</span><b>Mon to Fri, 8am to 5pm</b></div><div><span>Based in</span><b>Kenya</b></div>
  </div></div>
</div></section>

</main>
<footer class="site-footer" id="footer"></footer>
<script type="module" src="/js/pages/contact.js"></script>
</body>
</html>
